tasks.withType(Test).configureEach {
  systemProperty 'API_SPEC_VERSION', project.version
  failFast = true
  // Mockito must be added as an agent, see:
  // https://javadoc.io/doc/org.mockito/mockito-core/latest/org.mockito/org/mockito/Mockito.html#0.3
  jvmArgs += [
    "-javaagent:${configurations.testRuntimeClasspath.find { it.name.contains('mockito-core') }}", '-Xshare:off'
  ]
  testLogging {
    events "passed", "skipped", "failed"
    exceptionFormat = 'full'
    showStandardStreams = true
  }
  reports {
    junitXml.required.set(true)
    html.required.set(true)
  }
}

tasks.named('test') {
  description = 'Runs unit tests only (no containers).'
  useJUnitPlatform {
    excludeEngines 'cucumber', 'junit-platform-suite'
  }
  exclude '**/*IntegrationTest*'
}

tasks.register('integrationTest', Test) {
  description = 'Runs boundary integration tests (Testcontainers).'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform {
    excludeEngines 'cucumber', 'junit-platform-suite'
  }
  include '**/*IntegrationTest*'
  shouldRunAfter tasks.named('test')
}

tasks.register('acceptanceTest', Test) {
  description = 'Runs BDD acceptance scenarios (Cucumber via the AcceptanceTest suite).'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform {
    includeEngines 'junit-platform-suite'
  }
  shouldRunAfter tasks.named('integrationTest')
}

tasks.named('check') {
  dependsOn 'integrationTest', 'acceptanceTest'
  finalizedBy 'testTimingReport'
}

tasks.register('testTimingReport') {
  group = 'verification'
  doLast {
    println '\nTest timing by category:'
    [test: 'unit', integrationTest: 'integration', acceptanceTest: 'acceptance'].each { dirName, label ->
      def dir = layout.buildDirectory.dir("test-results/${dirName}").get().asFile
      if (!dir.exists()) return
      def secs = dir.listFiles({ f -> f.name ==~ /TEST-.*\.xml/ } as FileFilter)
                    .sum { (new groovy.xml.XmlSlurper().parse(it).@time.text() ?: '0') as double } ?: 0d
      println String.format('  %-12s %6.2fs', label, secs)
    }
  }
}

tasks.named('jacocoTestReport') {
  dependsOn tasks.named('test'), tasks.named('integrationTest'), tasks.named('acceptanceTest')
  executionData fileTree(
    dir: layout.buildDirectory.dir("jacoco").get().asFile,
    include: ["*.exec"]
  )
  reports {
    xml.required.set(true)
    csv.required.set(false)
    html.required.set(true)
  }
}
