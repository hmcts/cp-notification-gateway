services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notificationgateway
      POSTGRES_USER: notificationgateway
      POSTGRES_PASSWORD: notificationgateway
    # No host port mapping: the app reaches Postgres over the compose network at `postgres:5432`.
    # (Avoids clashing with a Postgres already bound to host 5432.)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notificationgateway -d notificationgateway"]
      interval: 5s
      timeout: 3s
      retries: 15

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The app requires Postgres (JPA + Flyway); point it at the compose service so it can start for
      # local runs and the DAST job. Flyway creates the notification table + the co-located jobs table.
      CP_NG_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notificationgateway
      CP_NG_DATASOURCE_USERNAME: notificationgateway
      CP_NG_DATASOURCE_PASSWORD: notificationgateway
